[project]
name = "pytest-strawberry"
version = "0.1.0"
description = "Pytest plugin for Strawberry GraphQL"
authors = [{ name = "Patrick Arminio", email = "patrick.arminio@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["graphql", "pytest", "strawberry-graphql", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
requires-python = ">=3.10,<4.0"
dependencies = [
  "pytest>=8.0,<10.0",
  "strawberry-graphql>=0.316.0",
]

[project.urls]
repository = "https://github.com/strawberry-graphql/pytest-strawberry"
issues = "https://github.com/strawberry-graphql/pytest-strawberry/issues"

[project.entry-points.pytest11]
pytest-strawberry = "pytest_strawberry.plugin"

[dependency-groups]
dev = [
  "mypy>=1.15.0,<3.0.0",
  "nox>=2026.8.10,<2027.0.0",
  "pre-commit>=4.0.0,<5.0.0",
  "pytest-xdist>=3.6.0,<4.0.0",
  "ruff>=0.14.1,<0.17.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "pytest_strawberry"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.autopub]
git-username = "Botberry"
git-email = "bot@strawberry.rocks"
project-name = "pytest-strawberry"
append-github-contributor = true
plugins = [
  "autopub.plugins.github",
  "autopub.plugins.uv",
]

[tool.mypy]
files = ["pytest_strawberry", "tests"]
strict = true
warn_unused_configs = true

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["pytest_strawberry", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "CPY001",
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["D", "INP001", "S101"]
"tests/*" = ["D", "S101"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
